<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <title>Key Capabilities Matrix - 3X-UI Suite</title>
  <desc>Four core architectural pillars: Stealthed L4 Ingress, Zero-Leak Loopback Core, RU-Block Outbound Filtering, and Kernel-Level Acceleration.</desc>
  
  <defs>
    <linearGradient id="featBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0d1525" />
    </linearGradient>

    <pattern id="featGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#featBg)" />
  <rect width="1200" height="280" rx="16" fill="url(#featGrid)" />
  <rect width="1200" height="280" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== PILLAR 1 ==================== -->
  <g transform="translate(36, 32)">
    <rect width="264" height="216" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="264" height="3" rx="1.5" fill="#38bdf8" />
    
    <!-- Icon / Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <path d="M 36 26 L 43 33 L 36 40 L 29 33 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="36" cy="33" r="2.5" fill="#38bdf8" />

    <text x="64" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">L4 STEALTH INGRESS</text>
    <text x="64" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Multiplexed Port 443</text>

    <text x="18" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Stream SNI Preread</text>
    
    <text x="18" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="18" dy="0">• Единый 443 порт: TCP + UDP</tspan>
      <tspan x="18" dy="20">• L4 инспекция без расшифровки</tspan>
      <tspan x="18" dy="20">• RAM сокет /dev/shm (Zero-Copy)</tspan>
      <tspan x="18" dy="20">• Anti-Loop fallback на 9443</tspan>
    </text>
  </g>

  <!-- ==================== PILLAR 2 ==================== -->
  <g transform="translate(324, 32)">
    <rect width="264" height="216" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="264" height="3" rx="1.5" fill="#10b981" />

    <!-- Icon / Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <path d="M 36 24 L 44 28 L 44 37 C 44 42 36 45 36 45 C 36 45 28 42 28 37 L 28 28 Z" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linejoin="round" />

    <text x="64" y="32" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">ZERO-LEAK CORE</text>
    <text x="64" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Loopback Isolation</text>

    <text x="18" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">127.0.0.1 Binding</text>

    <text x="18" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="18" dy="0">• webListen строго 127.0.0.1</tspan>
      <tspan x="18" dy="20">• База x-ui.db с правами 600</tspan>
      <tspan x="18" dy="20">• Скрытый URL /panel_secret/</tspan>
      <tspan x="18" dy="20">• UFW default deny incoming</tspan>
    </text>
  </g>

  <!-- ==================== PILLAR 3 ==================== -->
  <g transform="translate(612, 32)">
    <rect width="264" height="216" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="264" height="3" rx="1.5" fill="#f59e0b" />

    <!-- Icon / Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <circle cx="36" cy="36" r="9" fill="none" stroke="#f59e0b" stroke-width="1.8" />
    <line x1="30" y1="30" x2="42" y2="42" stroke="#f59e0b" stroke-width="1.8" />

    <text x="64" y="32" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">ACTIVE CAMOUFLAGE</text>
    <text x="64" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Anti-Probing &amp; RU-Block</text>

    <text x="18" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">DPI Defense &amp; Blackhole</text>

    <text x="18" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="18" dy="0">• Отдача реалистичного Fake Site</tspan>
      <tspan x="18" dy="20">• Сброс зондов TCP RST (444)</tspan>
      <tspan x="18" dy="20">• Блокировка геозон RU &amp; BitTorrent</tspan>
      <tspan x="18" dy="20">• Fail2ban джейлы с баном на 24ч</tspan>
    </text>
  </g>

  <!-- ==================== PILLAR 4 ==================== -->
  <g transform="translate(900, 32)">
    <rect width="264" height="216" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="264" height="3" rx="1.5" fill="#818cf8" />

    <!-- Icon / Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#312e81" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
    <path d="M 38 24 L 28 35 L 35 35 L 34 46 L 44 34 L 37 34 Z" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linejoin="round" />

    <text x="64" y="32" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">KERNEL ACCELERATION</text>
    <text x="64" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">BBR, TFO &amp; High-Limit</text>

    <text x="18" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Linux TCP/UDP Tuning</text>

    <text x="18" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <tspan x="18" dy="0">• Алгоритм TCP BBR + очереди fq</tspan>
      <tspan x="18" dy="20">• TCP Fast Open = 3 (0-RTT)</tspan>
      <tspan x="18" dy="20">• Буферы UDP/QUIC до 16 МБ</tspan>
      <tspan x="18" dy="20">• LimitNOFILE = 65535 дескрипторов</tspan>
    </text>
  </g>
</svg>
